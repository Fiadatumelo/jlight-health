name: JLIGHT backend tests

on:
  pull_request:
    paths:
      - "jlight-backend/**"
      - ".github/workflows/jlight-backend-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "jlight-backend/**"
      - ".github/workflows/jlight-backend-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jlight-backend/requirements.txt
      - name: Install backend dependencies
        working-directory: jlight-backend
        run: python -m pip install -r requirements.txt pytest
      - name: Run analytical engine regression tests
        working-directory: jlight-backend
        run: python tests/test_all.py
      - name: Run API authentication regression tests
        working-directory: jlight-backend
        run: python -m pytest -q tests/test_api_security.py
