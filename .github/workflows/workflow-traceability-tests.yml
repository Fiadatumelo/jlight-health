name: Workflow Traceability Tests

on:
  pull_request:
    paths:
      - "jlight-backend/engine/workflow_traceability.py"
      - "jlight-backend/tests/test_workflow_traceability.py"
      - ".github/workflows/workflow-traceability-tests.yml"
  push:
    branches:
      - main
      - "feat/source-workflow-traceability"
    paths:
      - "jlight-backend/engine/workflow_traceability.py"
      - "jlight-backend/tests/test_workflow_traceability.py"
      - ".github/workflows/workflow-traceability-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic workflow traceability tests
        working-directory: jlight-backend
        run: python -m unittest tests.test_workflow_traceability -v
