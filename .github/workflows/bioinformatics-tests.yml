name: JLIGHT Bioinformatics patient-link tests

on:
  pull_request:
    paths:
      - "index.html"
      - "jlight-backend/api/app.py"
      - "jlight-backend/tests/test_canonical_patient_bioinformatics_connection.py"
      - ".github/workflows/bioinformatics-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "jlight-backend/api/app.py"
      - "jlight-backend/tests/test_canonical_patient_bioinformatics_connection.py"
      - ".github/workflows/bioinformatics-tests.yml"

permissions:
  contents: read

jobs:
  bioinformatics-patient-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test canonical patient and Bioinformatics connection
        run: python jlight-backend/tests/test_canonical_patient_bioinformatics_connection.py
